      href="../../node_modules/@flaticon/flaticon-uicons/css/all/all.css"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="../css/var.css" />
    <link rel="stylesheet" href="../css/index.css" />
    <link rel="stylesheet" href="../css/editor.css" />
    <link rel="stylesheet" href="../css/bottomBar.css" />

    <link rel="stylesheet" href="../css/tabManager.css" />
    <link rel="stylesheet" href="../css/scroller.css" />
    <link rel="stylesheet" href="../css/emptyMenu.css" />

    <style>
      #fps {
        position: fixed;
        top: 10px;
        right: 10px;
        font-size: 16px;
        color: #ffffff;
        padding: 5px;
        user-select: none;
        z-index: 1000;
      }
    </style>
  </head>
  <body>
    <section class="main-section">
      <div class="command box">
        <div class="command-header">
          <input
            type="search"
            class="command-search"
            placeholder="Search files by name"
          />
          <div class="command-body">
            <div class="command-els-top box-bottom"></div>
            <div class="command-els"></div>
          </div>
        </div>
      </div>
      <div class="sidebar-tab-selector box"></div>
      <div class="sidebar-left box">
        <div class="sidebar-menu"></div>
      </div>
      <div class="file-manager box-top box-bottom">
        <ul class="files-ul"></ul>
      </div>
      <div class="editor editor-empty">
        <div class="empty-menu"></div>
        <div class="editor-search-bar">
          <div class="search-bar-input-container">
            <input
              class="search-bar-input"
              type="text"
              placeholder="Rechercher"
              autocomplete="off"
              spellcheck="false"
            />

            <span class="search-bar-counter"></span>
          </div>
          <button
            class="search-bar-button search-bar-previous"
            type="button"
            title="Occurrence précédente"
          >
            <i class="fi fi-rr-angle-small-up"></i>
          </button>
          <button
            class="search-bar-button search-bar-next"
            type="button"
            title="Occurrence suivante"
          >
            <i class="fi fi-rr-angle-small-down"></i>
          </button>
          <button
            class="search-bar-button search-bar-close"
            type="button"
            title="Fermer"
          >
            <i class="fi fi-rr-cross-small"></i>
          </button>
        </div>
        <div class="line-numbers"></div>
        <div class="editor-output editor-select"></div>
        <div class="editor-caret editor-select"></div>
        <div class="editor-select-highlight editor-select"></div>
        <div class="editor-search-highlight editor-select"></div>
      </div>
      <div class="sidebar-right box">
        <div class="sidebar-menu"></div>
      </div>
      <div class="bottomBar box-top">
        <section class="left"></section>
        <section class="middle"></section>
        <section class="right">
          <div class="bottomBar-el scroller-open" id="config-space">
            <span class="scroller-title"></span>
          </div>
          <div class="bottomBar-el">
            <span class="bottomBar-cursorPos bottomBar-text"></span>
          </div>
        </section>
      </div>
    </section>

    <script src="../js/core/Tools.js"></script>
    <script src="../js/core/Event.js"></script>

    <script src="../js/agent/utils/AgentPath.js"></script>

    <script src="../js/agent/tools/ToolSerialization.js"></script>
    <script src="../js/agent/tools/ToolRegistry.js"></script>

    <script src="../js/agent/tools/EditorToolRegistry.js"></script>
    <script src="../js/agent/context/ContextManager.js"></script>
    <script src="../js/agent/model/ModelClient.js"></script>
    <script src="../js/agent/files/LargeFileWriter.js"></script>
    <script src="../js/agent/files/FileContextManager.js"></script>
    <script src="../js/agent/files/WorkspaceFileManager.js"></script>
    <script src="../js/agent/files/ActiveFileManager.js"></script>
    <script src="../js/agent/project/ProjectExplorer.js"></script>
    <script src="../js/agent/runtime/AgentRunner.js"></script>
    <script src="../js/core/Agent.js"></script>

    <script src="../js/controller/SelectController.js"></script>
    <script src="../js/controller/WriterController.js"></script>
    <script src="../js/controller/LineController.js"></script>
    <script src="../js/controller/HighlightController.js"></script>

    <script src="../js/controller/SearchController.js"></script>

    <script src="../js/manager/TabManager.js"></script>

    <script src="../js/manager/SidebarManager.js"></script>
    <script src="../js/manager/ScrollerManager.js"></script>
    <script src="../js/manager/SavePopupManager.js"></script>
    <script src="../js/manager/ThreadManager.js"></script>
    <script src="../js/manager/StatesManager.js"></script>

    <script src="../js/addon/BottomBar.js"></script>

    <script src="../config/prompt/models/mistral.js"></script>
    <script src="../config/prompt/index.js"></script>
    <script src="../config/AgentAI.js"></script>

    <div id="fps"></div>

    <script>
      addEvent("DOMContentLoaded", function () {
        var fpsContainer = document.getElementById("fps");
        var lastTime;
        var fps = 0;

        function updateFPS() {
          var currentTime = performance.now();
          var deltaTime = currentTime - (lastTime || currentTime);
          lastTime = currentTime;

          fps = Math.round(1000 / deltaTime);
          requestAnimationFrame(updateFPS);
        }
        setInterval(() => {
          fpsContainer.textContent = "FPS: " + fps;
        }, 150);
        updateFPS();
      });
    </script>
  </body>
</html>
