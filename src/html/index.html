<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https: http://localhost:11434 ws://127.0.0.1:*; object-src 'none'; base-uri 'self'; form-action 'self'"
    />
    <title>NCE</title>
    <link
      href="../assets/flaticon/all.css"
      rel="stylesheet"
    />
    <link rel="icon" href="../assets/logo/NCE/dark-logo.ico" />

    <link rel="stylesheet" href="../css/var.css" />
    <link rel="stylesheet" href="../css/index.css" />
    <link rel="stylesheet" href="../css/titlebar.css" />
    <link rel="stylesheet" href="../css/editor.css" />
    <link rel="stylesheet" href="../css/bottomBar.css" />
    <link rel="stylesheet" href="../css/bottomPanel.css" />
    <link rel="stylesheet" href="../css/quickPanel.css" />
    <link rel="stylesheet" href="../css/performanceDashboard.css" />
    <link rel="stylesheet" href="../css/tabManager.css" />
    <link rel="stylesheet" href="../css/scroller.css" />
    <link rel="stylesheet" href="../css/emptyMenu.css" />
    <link rel="stylesheet" href="../css/sidebar.css" />
    <link rel="stylesheet" href="../css/SearchBar.css" />
    <link rel="stylesheet" href="../css/settings.css" />
    <link rel="stylesheet" href="../css/pictureView.css" />
    <link rel="stylesheet" href="../css/markdownView.css" />

    <link rel="stylesheet" href="../css/sidebar/fileExplorer.css" />
    <link rel="stylesheet" href="../css/sidebar/search.css" />
    <link rel="stylesheet" href="../css/sidebar/agent.css">

    <link rel="stylesheet" href="../css/nsh/dark.css" />
    <link rel="stylesheet" href="../css/nsh/light.css" />
  </head>
  <body>
    <header class="nce-titlebar">
      <div class="nce-titlebar-content">
        <div class="nce-titlebar-left">
          <nav class="nce-titlebar-menubar" role="menubar" aria-label="Application menu"></nav>
        </div>
        <div class="nce-titlebar-title">NCE</div>
        <div class="nce-titlebar-drag-space" aria-hidden="true"></div>
      </div>
    </header>
    <section class="main-section">
      <div class="quick-panel-host"></div>
      <div class="sidebar-tab-selector box box-bottom"></div>
      <div class="sidebar-left box">
        <div class="sidebar-menu"></div>
      </div>
      <div class="file-manager box-top">
        <ul class="files-ul"></ul>
      </div>
      <div class="editor editor-empty">
        <div class="settings-view-host box-bottom" hidden></div>
        <div class="picture-view-host box-bottom" hidden>
          <div class="picture-view-viewport">
            <div class="picture-view-content">
              <p class="picture-view-status" hidden></p>
              <img class="picture-view-image" alt="" draggable="false">
            </div>
          </div>
        </div>
        <div class="markdown-view-host box-bottom" hidden>
          <div class="markdown-view-viewport">
            <div class="markdown-view-status" hidden></div>
            <article class="markdown-preview-content"></article>
          </div>
        </div>
        <div class="empty-menu"></div>
        <div class="editor-search-bar">
          <button
            class="search-bar-button search-bar-expand"
            type="button"
            title="Afficher le remplacement"
            aria-expanded="false"
          >
            <i class="fi fi-rr-angle-small-down"></i>
          </button>
          <div class="search-bar-input-container">
            <input
              class="search-bar-input"
              type="text"
              placeholder="Search"
              autocomplete="off"
              spellcheck="false"
            />

            <span class="search-bar-counter"></span>
          </div>
          <div class="search-bar-replace-container" hidden>
            <input
              class="search-bar-replace-input"
              type="text"
              placeholder="Replace"
              autocomplete="off"
              spellcheck="false"
            />
          </div>
          <div class="search-bar-replace-actions" hidden>
            <button class="search-bar-button search-bar-replace-next" type="button" title="Remplacer puis suivant" aria-label="Remplacer puis suivant">
              <span aria-hidden="true">→</span>
            </button>
            <button class="search-bar-button search-bar-replace-all" type="button" title="Tout remplacer" aria-label="Tout remplacer">
              <span aria-hidden="true">⟳</span>
            </button>
          </div>
          <button
            class="search-bar-button search-bar-previous"
            type="button"
            title="Occurrence précédente"
          >
            <i class="fi fi-rr-angle-small-up"></i>
          </button>
          <button
            class="search-bar-button search-bar-next"
            type="button"
            title="Occurrence suivante"
          >
            <i class="fi fi-rr-angle-small-down"></i>
          </button>
          <button
            class="search-bar-button search-bar-close"
            type="button"
            title="Fermer"
          >
            <i class="fi fi-rr-cross-small"></i>
          </button>
        </div>
        <div class="line-numbers box-bottom"></div>
        <div class="editor-output editor-select"></div>
        <div class="editor-caret editor-select"></div>
        <div class="editor-select-highlight editor-select"></div>
        <div class="editor-search-highlight editor-select"></div>
      </div>
      <div class="sidebar-right box">
        <div class="sidebar-menu"></div>
      </div>
      <section class="bottom-panel" aria-label="Bottom Panel" hidden>
        <div
          class="nce-panel-resizer bottom-panel-resize-handle"
          role="separator"
          aria-label="Resize Bottom Panel"
          aria-orientation="horizontal"
          aria-valuemin="120"
          aria-valuemax="400"
          aria-valuenow="250"
          tabindex="0"
        ></div>
        <header class="bottom-panel-header">
          <h2 class="bottom-panel-title" id="bottom-panel-title">Terminal</h2>
          <nav class="bottom-panel-views" role="tablist" aria-label="Bottom Panel views" hidden></nav>
          <div class="bottom-panel-actions">
            <button class="bottom-panel-icon-button bottom-panel-new" type="button" aria-label="New Terminal" title="New Terminal">
              <i class="fi fi-rr-plus" aria-hidden="true"></i>
            </button>
            <button class="bottom-panel-icon-button bottom-panel-kill" type="button" aria-label="Kill Active Terminal" title="Kill Active Terminal" disabled>
              <i class="fi fi-rr-trash" aria-hidden="true"></i>
            </button>
            <div class="bottom-panel-terminal-actions-slot" hidden></div>
            <button
              class="bottom-panel-icon-button bottom-panel-close"
              type="button"
              aria-label="Close Bottom Panel"
              title="Close Bottom Panel"
            >
              <i class="fi fi-rr-cross" aria-hidden="true"></i>
            </button>
          </div>
        </header>
        <div class="bottom-panel-content" id="bottom-panel-content" role="tabpanel" aria-label="Bottom Panel content"></div>
      </section>
      <div class="bottomBar box-top">
        <section class="left">
          <button
            class="bottomBar-terminal-toggle"
            type="button"
            hidden
            aria-label="Toggle Terminal"
            aria-expanded="false"
            title="Toggle Terminal"
          >
            <svg viewBox="0 0 16 16" aria-hidden="true" focusable="false">
              <path d="m3 4 4 4-4 4M9 12h4" />
            </svg>
            <span>Terminal</span>
          </button>
        </section>
        <section class="middle">
          <div class="bottomBar-el bottomBar-file-status" style="display: none">
            <span class="bottomBar-text"></span>
          </div>
        </section>
        <section class="right">
          <div class="bottomBar-el scroller-open" id="view-type" hidden>
            <span class="scroller-title"></span>
          </div>
          <div class="bottomBar-el scroller-open" id="language">
            <span class="scroller-title"></span>
          </div>
          <div class="bottomBar-el scroller-open" id="config-space">
            <span class="scroller-title"></span>
          </div>
          <div class="bottomBar-el bottomBar-cursor-status">
            <span class="bottomBar-cursorPos bottomBar-text"></span>
          </div>
        </section>
      </div>
    </section>

    <script src="./renderer.js" vite-ignore></script>
  </body>
</html>
